<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frogger Arcade - TowMes©™</title>
    <style>
        /* إعدادات مانشو 2: الخلفية الحمراء الداكنة */
        body, html {
            margin: 0; padding: 0;
            background-color: #4d0000; /* أحمر مغلق فخم */
            height: 100vh; display: flex;
            flex-direction: column; align-items: center;
            justify-content: center; font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        /* حاوية المحاكي */
        #emu-container {
            position: relative;
            width: 95vw; height: 65vh;
            border: 4px solid #ffd700; /* إطار ذهبي */
            background: #000; border-radius: 15px;
            overflow: hidden; display: none; /* مخفي للبداية */
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* الأزرار الاحترافية */
        .btn-group {
            display: flex; flex-direction: column;
            gap: 15px; width: 85%; max-width: 350px;
        }

        .action-btn {
            padding: 18px; border-radius: 50px;
            border: 2px solid #ffd700; cursor: pointer;
            font-weight: bold; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none;
        }

        /* زر العب الآن */
        .play-now {
            background: linear-gradient(145deg, #00c853, #1b5e20);
            color: white; box-shadow: 0 5px 15px rgba(0,200,83,0.4);
        }

        /* زر فول سكرين */
        .full-screen {
            background: linear-gradient(145deg, #ffd700, #b8860b);
            color: #000; display: none; margin-top: 10px;
        }

        .ar-txt { font-size: 22px; font-weight: 900; }
        .en-txt { font-size: 11px; opacity: 0.8; text-transform: uppercase; }

        /* واترمارك TowMes */
        .towmes-mark {
            margin-top: 20px; color: rgba(255, 215, 0, 0.6);
            font-size: 16px; font-weight: bold; letter-spacing: 1px;
        }

        .action-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="ui-start" class="btn-group">
        <button class="action-btn play-now" onclick="launchGame()">
            <span class="ar-txt">اِلْعَبْ اَلْآنَ</span>
            <span class="en-txt">PLAY NOW</span>
        </button>
    </div>

    <div id="emu-container">
        <iframe id="game-frame" src=""></iframe>
    </div>

    <div class="btn-group">
        <button id="fs-trigger" class="action-btn full-screen" onclick="goFull()">
            <span class="ar-txt">مِلْءُ اَلشَّاشَةِ</span>
            <span class="en-txt">FULL SCREEN MODE</span>
        </button>
    </div>

    <div class="towmes-mark">Developed by TowMes©™</div>

    <script>
        // رابط المحاكي الذي فحصناه
        const targetUrl = "https://megadrive-emulator.com/mobile-emulator/index.html?prn=Frogger_UJ.bin";

        function launchGame() {
            document.getElementById('ui-start').style.display = 'none';
            document.getElementById('emu-container').style.display = 'block';
            document.getElementById('fs-trigger').style.display = 'flex';
            document.getElementById('game-frame').src = targetUrl;
        }

        function goFull() {
            let elem = document.getElementById("emu-container");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
