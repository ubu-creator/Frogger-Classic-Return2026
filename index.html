<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogger Arcade - TowMes©™</title>
    <style>
        /* إعدادات مانشو 2: خلفية حمراء داكنة جداً */
        body, html {
            margin: 0; padding: 0;
            background-color: #4d0000; /* أحمر مغلق فخم */
            height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Watermark */
        .watermark {
            position: absolute;
            top: 10px;
            right: 15px;
            color: rgba(255, 215, 0, 0.3);
            font-weight: bold;
            font-size: 18px;
            z-index: 10;
        }

        /* إطار اللعبة (المحاكي) */
        .game-container {
            width: 95%;
            height: 70%;
            border: 4px solid #ffd700; /* إطار ذهبي */
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: none; /* مخفي حتى الضغط على Play */
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* الأزرار الاحترافية */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 400px;
        }

        .main-btn {
            padding: 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }

        /* زر Play Now الجميل */
        .play-btn {
            background: linear-gradient(145deg, #00c853, #1b5e20);
            color: white;
        }

        /* زر Full Screen */
        .fs-btn {
            background: linear-gradient(145deg, #ffd700, #b8860b);
            color: #000;
            display: none; /* يظهر بعد تشغيل اللعبة */
        }

        .text-en { font-size: 14px; opacity: 0.9; text-transform: uppercase; }
        .text-ar { font-size: 24px; font-weight: 900; }

        .main-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="watermark">Developed by TowMes©™</div>

    <div id="start-screen" class="btn-group">
        <button class="main-btn play-btn" onclick="startGame()">
            <span class="text-en">PLAY NOW</span>
            <span class="text-ar">▶️ اِلْعَبْ اَلْآنَ</span>
        </button>
    </div>

    <div id="game-box" class="game-container">
        <iframe id="emu-frame" src=""></iframe>
    </div>

    <div id="controls" class="btn-group" style="margin-top: 15px;">
        <button id="fs-button" class="main-btn fs-btn" onclick="toggleFullScreen()">
            <span class="text-en">FULL SCREEN</span>
            <span class="text-ar">📺 مِلْءُ اَلشَّاشَةِ</span>
        </button>
    </div>

    <script>
        const gameUrl = "https://gam.onl/arcade/frogger.html#game";

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-box').style.display = 'block';
            document.getElementById('fs-button').style.display = 'flex';
            document.getElementById('emu-frame').src = gameUrl;
        }

        function toggleFullScreen() {
            let elem = document.getElementById("game-box");
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    alert(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
