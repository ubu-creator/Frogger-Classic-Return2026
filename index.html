<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogger Arcade - TowMes©™</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            background-color: #4d0000; /* أحمر مغلق كما طلبت */
            height: 100vh; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
        }
        .game-wrapper {
            width: 95%; height: 70%;
            border: 5px solid #ffd700; /* إطار ذهبي */
            background: #000; border-radius: 15px; overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .play-now {
            margin-top: 20px; padding: 15px 40px;
            background: linear-gradient(to bottom, #00c853, #1b5e20);
            color: white; border: none; border-radius: 50px;
            font-size: 25px; font-weight: 900; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .watermark { color: rgba(255, 215, 0, 0.4); margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <iframe src="https://wayou.github.io/frogger/" allowfullscreen></iframe>
    </div>

    <button class="play-now" onclick="location.reload()">
        REPLAY - اِلْعَبْ اَلْآنَ 🚀
    </button>

    <div class="watermark">Developed by TowMes©™</div>

</body>
</html>
