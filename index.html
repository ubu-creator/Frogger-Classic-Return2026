<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #4d0000; color: gold; text-align: center; margin: 0; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: #000; border: 4px solid gold; width: 90vw; height: 50vh; image-rendering: pixelated; }
        .ui { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 220px; margin-top: 10px; }
        button { background: gold; border: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 20px; cursor: pointer; box-shadow: 0 4px #b8860b; }
        .play-now { grid-column: span 3; background: #00c853; color: white; margin-bottom: 5px; }
        .watermark { margin-top: 10px; font-weight: bold; opacity: 0.7; }
    </style>
</head>
<body>
    <h2 style="margin:5px;">FROGGER ATARI - Azraq2</h2>
    <canvas id="g"></canvas>
    <div class="ui">
        <button class="play-now" onclick="rst()">اِلْعَبْ اَلْآنَ - PLAY NOW</button>
        <div></div><button onclick="mv(0,-40)">↑</button><div></div>
        <button onclick="mv(-40,0)">←</button><button onclick="mv(0,40)">↓</button><button onclick="mv(40,0)">→</button>
    </div>
    <div class="watermark">Developed by TowMes©™</div>

    <script>
        const c = document.getElementById('g'), x = c.getContext('2d');
        c.width = 400; c.height = 400;
        let f = {x:185, y:360}, obs = [];
        
        // بناء العقبات بتوازن إحصائي دقيق (ناصر الكود)
        function init() {
            obs = [];
            for(let i=0; i<6; i++) {
                obs.push({
                    x: Math.random()*400, 
                    y: 40 + (i*50), 
                    w: 60 + Math.random()*40, 
                    s: (1.5 + Math.random()*2) * (i%2?1:-1),
                    c: ['#f00','#ff0','#fff','#0ff','#f80','#f0f'][i]
                });
            }
        }

        function draw() {
            x.fillStyle = '#000'; x.fillRect(0,0,400,400); // الطريق
            x.fillStyle = '#111'; x.fillRect(0,360,400,40); // البداية
            x.fillStyle = '#004'; x.fillRect(0,0,400,40);   // النهاية

            obs.forEach(o => {
                o.x += o.s;
                if(o.x > 400) o.x = -o.w;
                if(o.x < -o.w) o.x = 400;
                x.fillStyle = o.c;
                x.fillRect(o.x, o.y, o.w, 30);
                // تصادم دقيق جداً
                if(f.x < o.x+o.w && f.x+30 > o.x && f.y < o.y+30 && f.y+30 > o.y) rst();
            });

            x.fillStyle = '#0f0'; x.fillRect(f.x, f.y, 30, 30); // الضفدع
            if(f.y < 40) { alert("WIN! - TowMes©™"); rst(); }
            requestAnimationFrame(draw);
        }

        function mv(dx,dy) { 
            f.x+=dx; f.y+=dy; 
            if(f.x<0) f.x=0; if(f.x>370) f.x=370;
            if(f.y>360) f.y=360;
        }
        function rst() { f = {x:185, y:360}; init(); }
        init(); draw();
    </script>
</body>
</html>
