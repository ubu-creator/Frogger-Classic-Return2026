<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frogger Extract - TowMes©™</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }
        canvas { background: #111; border: 2px solid #333; max-width: 100vw; max-height: 100vh; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        // Developed by TowMes©™ - Full Extraction Logic
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 399;
        canvas.height = 532;

        const grid = 33.25;
        let frog = { x: grid * 6, y: grid * 15, width: grid, height: grid };

        // Game Loop
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Background (Road & River)
            ctx.fillStyle = '#000044'; // River
            ctx.fillRect(0, grid, canvas.width, grid * 6);
            ctx.fillStyle = '#111'; // Road
            ctx.fillRect(0, grid * 8, canvas.width, grid * 7);

            // Draw Frog
            ctx.fillStyle = 'lime';
            ctx.fillRect(frog.x, frog.y, frog.width - 4, frog.height - 4);

            requestAnimationFrame(update);
        }

        // Input Handling
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') frog.y -= grid;
            if (e.key === 'ArrowDown') frog.y += grid;
            if (e.key === 'ArrowLeft') frog.x -= grid;
            if (e.key === 'ArrowRight') frog.x += grid;
        });

        update();
    </script>
</body>
</html>
