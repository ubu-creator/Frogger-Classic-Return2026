<!DOCTYPE html>
<html>
<head>
    <title>Frogger Retro - TowMes©™</title>
    <style>
        body { background: #4d0000; color: gold; text-align: center; font-family: Arial; }
        canvas { background: #000; border: 4px solid #ffd700; display: block; margin: 20px auto; }
        .ui-btn { padding: 15px 30px; font-size: 20px; background: #00c853; border: none; border-radius: 20px; color: white; cursor: pointer; }
        .watermark { position: fixed; bottom: 10px; width: 100%; text-align: center; opacity: 0.5; }
    </style>
</head>
<body>
    <h1>FROGGER - TOWMES EDITION</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="controls">
        <button class="ui-btn" onclick="location.reload()">PLAY AGAIN - اِلْعَبْ جَدِيداً</button>
    </div>
    <div class="watermark">Developed by TowMes©™</div>

    <script>
        // نظام ناصر الكود - محرك اللعبة البسيط
        const canvas = document.getElementById('game');
        const context = canvas.getContext('2d');
        let grid = 40;
        let frog = { x: grid * 5, y: grid * 9 };
        
        function loop() {
            requestAnimationFrame(loop);
            context.clearRect(0,0,canvas.width,canvas.height);
            
            // رسم الضفدع
            context.fillStyle = '#00ff00';
            context.fillRect(frog.x, frog.y, grid-2, grid-2);
            
            // رسم خط النهاية
            context.fillStyle = 'blue';
            context.fillRect(0, 0, canvas.width, grid);
        }

        document.addEventListener('keydown', function(e) {
            if (e.which === 37 && frog.x > 0) frog.x -= grid;
            if (e.which === 39 && frog.x < canvas.width - grid) frog.x += grid;
            if (e.which === 38 && frog.y > 0) frog.y -= grid;
            if (e.which === 40 && frog.y < canvas.height - grid) frog.y += grid;
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
