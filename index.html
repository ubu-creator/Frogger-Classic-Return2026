<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* CSS CORE STRUCTURE */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 1. TOP MARQUEE (Medium Size) */
        .marquee-top {
            background: #990000;
            color: #ffffff;
            padding: 8px 0;
            font-size: 18px; /* Medium Size */
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid #ff0000;
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee-top span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee-speed 10s linear infinite;
        }

        @keyframes marquee-speed {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* 2. HORIZONTAL LAYOUT FOR LANGUAGES */
        .main-grid {
            display: flex;
            justify-content: space-around;
            padding: 20px 10px;
            gap: 10px;
            flex-wrap: nowrap; /* Forces horizontal alignment */
        }

        .lang-column {
            flex: 1;
            background: #111111;
            border: 1px solid #330000;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.1);
            min-width: 100px;
        }

        .lang-column:hover {
            border-color: #ff0000;
            background: #1a0000;
        }

        .lang-title {
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #ff0000;
            padding-bottom: 5px;
            font-size: 14px;
        }

        .step {
            font-size: 12px;
            margin: 8px 0;
            color: #cccccc;
            line-height: 1.4;
        }

        .arrow { color: #ff0000; font-weight: bold; }

        .ar { direction: rtl; }
    </style>
</head>
<body>

    <div class="marquee-top">
        <span>How To Use Our App &bull; How To Use Our App &bull; How To Use Our App</span>
    </div>

    <div class="main-grid">
        
        <div class="lang-column">
            <div class="lang-title">ENGLISH</div>
            <div class="step">Top YouTube <span class="arrow">...</span></div>
            <div class="step">Click General</div>
            <div class="step">Appearance</div>
            <div class="step" style="color:#ff0000; font-weight:bold;">Dark Mode</div>
        </div>

        <div class="lang-column">
            <div class="lang-title">FRANÇAIS</div>
            <div class="step">YouTube <span class="arrow">...</span></div>
            <div class="step">Paramètres</div>
            <div class="step">Apparence</div>
            <div class="step" style="color:#ff0000; font-weight:bold;">Mode Sombre</div>
        </div>

        <div class="lang-column ar">
            <div class="lang-title">العربية</div>
            <div class="step">أعلى يوتيوب <span class="arrow">...</span></div>
            <div class="step">الإعدادات عامة</div>
            <div class="step">المظهر</div>
            <div class="step" style="color:#ff0000; font-weight:bold;">وضع داكن</div>
        </div>

    </div>

</body>
</html>
