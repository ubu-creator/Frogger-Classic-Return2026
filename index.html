<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* 1. STABILIZE PAGE - منع اهتزاز أو تحرك الصفحة */
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* تثبيت العرض ومنع التمرير الجانبي */
            position: fixed;   /* تثبيت الهيكل العام */
        }

        /* 2. MEDIUM MARQUEE - الشريط العلوي */
        .marquee-container {
            background: #8b0000;
            color: #ffffff;
            height: 40px;
            line-height: 40px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid #ff0000;
            white-space: nowrap;
            overflow: hidden;
        }

        .marquee-content {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-text 12s linear infinite;
        }

        @keyframes scroll-text {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* 3. FIXED HORIZONTAL GRID - التنسيق الأفقي الثابت */
        .instruction-grid {
            display: flex; /* ترتيب أفقي إجباري */
            width: 100%;
            height: calc(100% - 42px);
            box-sizing: border-box;
            padding: 10px 5px;
            gap: 5px;
        }

        .column {
            flex: 1; /* تقسيم الشاشة لثلاثة أجزاء متساوية تماماً */
            background: #0a0a0a;
            border: 1px solid #330000;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 2px;
            box-shadow: inset 0 0 10px #000;
        }

        .column:hover {
            border-color: #ff0000;
        }

        /* Titles and Steps */
        .title {
            color: #ff0000;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
            text-decoration: underline;
        }

        .step-text {
            font-size: 10px;
            margin: 5px 0;
            text-align: center;
            color: #dddddd;
            width: 100%;
        }

        .red-dot { color: #ff0000; font-weight: bold; }
        .highlight { color: #ff0000; font-weight: bold; font-size: 11px; margin-top: 5px;}

        /* RTL for Arabic */
        .ar { direction: rtl; }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="marquee-content">
            How To Use Our App • How To Use Our App • How To Use Our App
        </div>
    </div>

    <div class="instruction-grid">
        
        <div class="column">
            <div class="title">ENGLISH</div>
            <div class="step-text">YouTube <span class="red-dot">...</span></div>
            <div class="step-text">General</div>
            <div class="step-text">Appearance</div>
            <div class="highlight">Dark Mode</div>
        </div>

        <div class="column">
            <div class="title">FRANÇAIS</div>
            <div class="step-text">YouTube <span class="red-dot">...</span></div>
            <div class="step-text">Paramètres</div>
            <div class="step-text">Apparence</div>
            <div class="highlight">Mode Sombre</div>
        </div>

        <div class="column ar">
            <div class="title">العربية</div>
            <div class="step-text">يوتيوب <span class="red-dot">...</span></div>
            <div class="step-text">إعدادات عامة</div>
            <div class="step-text">المظهر</div>
            <div class="highlight">وضع داكن</div>
        </div>

    </div>

</body>
</html>
